name: Release assets

# Makes sure the GitHub Release for the package.json version holds the Claude Desktop bundle:
# knowtarium-<version>.mcpb, the same file as knowtarium.mcpb (so
# releases/latest/download/knowtarium.mcpb always works) and SHA256SUMS. It runs after every
# publish (the tag's version) and on every push to main (package.json's version), and does
# nothing until that version has its tag and is on npm (the release goes with a published
# version; the bundle holds the CLI built from the tag, the same code as npm's), or once the
# release has all three files. It never replaces a file a release already has. The bundle is
# built with a read-only token; only the last job can write, and it runs no code from the
# repository. See RELEASING.md.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a run after a publish has a group of its own (per tag), so a later push to main can never
  # replace it while it waits (GitHub keeps one pending run per group); pushes and manual runs
  # share theirs. The release job, the only writer, takes turns per tag (see there).
  group: >-
    release-assets-${{ github.event_name == 'workflow_run' &&
    format('publish-{0}', github.event.workflow_run.head_branch) || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Pick the version and see what its release lacks
    # after a publish: only this repository's own publish.yml, run for a pushed tag (a pull
    # request from a fork could add a workflow of its own called Publish)
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.path == '.github/workflows/publish.yml'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # the tag the publish run built (v1.2.3), from the event, never run as code
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$EVENT" = "workflow_run" ]; then
            case "$RUN_REF" in
              v[0-9]*) version="${RUN_REF#v}" ;;
              *) skip "the publish run wasn't for a version tag" ;;
            esac
            attempts=20 # npm can take a moment to serve a version it just accepted
          else
            [ "$(jq -r '.private // false' package.json)" = "true" ] && skip "package.json is private"
            version=$(jq -r .version package.json)
            attempts=1
          fi
          [ "$version" = "0.0.0" ] && skip "the version is the 0.0.0 placeholder"
          tag="v$version"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || skip "$tag isn't tagged yet"
          published=""
          for attempt in $(seq "$attempts"); do
            published=$(npm view "knowtarium@$version" version 2> /dev/null || true)
            [ "$published" = "$version" ] && break
            [ "$attempt" -lt "$attempts" ] && sleep 15
          done
          [ "$published" = "$version" ] || skip "knowtarium@$version isn't on npm yet"
          if names=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name' 2> "$RUNNER_TEMP/api-error"); then
            have=0
            for file in "knowtarium-$version.mcpb" knowtarium.mcpb SHA256SUMS; do
              if grep -qxF "$file" <<< "$names"; then have=$((have + 1)); fi
            done
            [ "$have" -eq 3 ] && skip "release $tag already has its files"
          elif ! grep -q "HTTP 404" "$RUNNER_TEMP/api-error"; then
            cat "$RUNNER_TEMP/api-error"
            exit 1
          fi
          # a partial release is refused by the release job, after the build
          {
            echo "build=true"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build the bundle from the tag
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # the bundle is built from the tagged source, whatever main holds now
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Check the tag's version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ "$(jq -r .version package.json)" != "$VERSION" ]; then
            echo "::error::the tag's package.json isn't version $VERSION"
            exit 1
          fi

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # a release build: it refuses a version npm doesn't have, validates the manifest and starts the
      # unpacked bundle's server
      - run: pnpm build:extras

      # from the versioned bundle, so a tag built before build:extras wrote the stable name and the
      # checksums gets them too
      - name: Gather the release files
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-files
          cp "dist-extras/knowtarium-$VERSION.mcpb" release-files/
          cp "dist-extras/knowtarium-$VERSION.mcpb" release-files/knowtarium.mcpb
          (cd release-files && sha256sum "knowtarium-$VERSION.mcpb" knowtarium.mcpb > SHA256SUMS)
          cat release-files/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create the release, or add the files it lacks
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # one writer per release at a time, so a publish run and a push run never both create it; a
    # waiting one that a newer one replaces was for the same release, which the newer one finishes
    concurrency:
      group: release-assets-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      # create the release and upload its files, and sign their build provenance; this job checks
      # out and runs nothing from the repository
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      # a signed record of which workflow run made each bundle: gh attestation verify
      # knowtarium.mcpb --repo Knowtarium/knowtarium-sdk. It names this run's commit (GITHUB_SHA:
      # main's head, on a push and after a publish alike), not the tag the bundle was built from;
      # the action can't be given another commit (it signs what the run's OIDC token says), and the
      # release itself names the tag
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-files/*.mcpb

      - name: Publish the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd release-files
          files=("knowtarium-$VERSION.mcpb" knowtarium.mcpb SHA256SUMS)
          sha256sum -c SHA256SUMS
          # the release's state again, now: nothing is ever replaced
          if names=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' 2> "$RUNNER_TEMP/api-error"); then
            release=exists
          elif grep -q "HTTP 404" "$RUNNER_TEMP/api-error"; then
            release=missing
            names=""
          else
            cat "$RUNNER_TEMP/api-error"
            exit 1
          fi
          have=0
          for file in "${files[@]}"; do
            if grep -qxF "$file" <<< "$names"; then have=$((have + 1)); fi
          done
          if [ "$have" -eq 3 ]; then
            echo "::notice::release $TAG already has its files"
            exit 0
          fi
          if [ "$have" -gt 0 ]; then
            # a new build wouldn't match the checksums already there
            echo "::error::release $TAG has only some of ${files[*]}; delete those files from the release, then run this workflow again"
            exit 1
          fi
          if [ "$release" = "missing" ]; then
            flags=()
            if [[ "$VERSION" == *-* ]]; then
              flags+=(--prerelease --latest=false)
            elif [ "$(npm view knowtarium dist-tags.latest)" = "$VERSION" ]; then
              flags+=(--latest)
            else
              flags+=(--latest=false)
            fi
            notes="knowtarium $VERSION is on npm: [knowtarium@$VERSION](https://www.npmjs.com/package/knowtarium/v/$VERSION).

          **Any agent:** run \`npx knowtarium@$VERSION agents\` (or \`npx knowtarium@latest agents\`) so your agents use this version, then restart them.

          **Claude Code and Codex:** install the Knowtarium plugin from [Knowtarium/knowtarium-plugins](https://github.com/Knowtarium/knowtarium-plugins), or update it there.

          **Claude Desktop:** download \`knowtarium.mcpb\` (the same file as \`knowtarium-$VERSION.mcpb\`), open it, then ask Claude to connect Knowtarium. It needs no terminal or Node.js.

          Check a download with \`sha256sum -c SHA256SUMS\` (\`shasum -a 256 -c SHA256SUMS\` on macOS)."
            # --generate-notes adds the comparison with the previous release below these notes
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Knowtarium $VERSION" --notes "$notes" --generate-notes "${flags[@]}" \
              "${files[@]}"
          else
            # without --clobber, gh refuses to replace a file the release already has
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}"
          fi
